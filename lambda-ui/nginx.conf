events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Aumentar tamaño máximo de archivo
    client_max_body_size 100M;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Logs para debugging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;

        # Servir archivos estáticos
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Proxy para el API Gateway - versión con /api/
        location /api/ {
            # Cambiar según dónde esté tu API Gateway
            # Opción 1: API en host local (fuera de Docker)
            proxy_pass http://host.docker.internal:8080/api/;
            
            # Opción 2: Si el API está en otro contenedor Docker, usar:
            # proxy_pass http://nombre-contenedor-api:8080/api/;
            
            # Opción 3: Si el API está en una IP específica:
            # proxy_pass http://192.168.1.100:8080/api/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # Manejar OPTIONS para CORS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Timeouts largos para operaciones que pueden tardar
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            
            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check directo
        location /health {
            proxy_pass http://host.docker.internal:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }
}