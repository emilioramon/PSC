version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: faas-postgres
    environment:
      POSTGRES_USER: faas
      POSTGRES_PASSWORD: faas123
      POSTGRES_DB: faas_storage
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faas -d faas_storage"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: faas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage-api:
    build: .
    container_name: faas-storage-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://faas:faas123@postgres:5432/faas_storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/lambdas --ignore-existing;
      mc mb myminio/encargos-input --ignore-existing;
      mc mb myminio/encargos-result --ignore-existing;
      echo 'Buckets created successfully';
      "

volumes:
  postgres_data:
  minio_data: